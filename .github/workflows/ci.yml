# CI: Rust tests on Linux (full, incl. libopenconnect auth against a
# local ocserv gateway) and macOS (core tests + staticlib + Xcode build
# with signing off). The macOS job is the no-local-Mac verification loop:
# it proves the Swift shell compiles and links against the Rust core,
# and runs the Helper's pf generation as a smoke check.
# It does NOT prove a real gateway connection, SeaTalk approval, or
# live traffic routing — those still need a trusted Mac (Phase 0).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libopenconnect-dev ocserv openconnect
      - name: Start test gateway
        # ocserv refuses to run without root ("This server requires root
        # access to operate"); Actions runners have passwordless sudo.
        run: sudo core/scripts/ocserv-test.sh start
      - name: Rust tests (incl. libopenconnect auth)
        working-directory: core
        env:
          AC_TEST_URL: https://127.0.0.1:4443
          AC_TEST_CA: /tmp/ocserv-test/ca-cert.pem
          AC_TEST_USER: testuser
          AC_TEST_PASS: testpass
        run: cargo test --features openconnect
      - name: CLI behavior contract (wrong password / bogus cookie)
        # Tun-independent only: the correct-password case needs a tun
        # device, which this sandbox may deny (see DESIGN.md §16.3.1).
        # Runs as root because the gateway's CA file is root-owned.
        env:
          AC_TEST_URL: https://127.0.0.1:4443
          AC_TEST_CA: /tmp/ocserv-test/ca-cert.pem
          AC_TEST_USER: testuser
        run: sudo -E core/scripts/cli-behavior-test.sh
      - name: Stop test gateway
        if: always()
        run: sudo core/scripts/ocserv-test.sh stop

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust tests (macOS, default features)
        working-directory: core
        run: cargo test
      - name: Build Rust staticlib for the Swift shell
        working-directory: core
        run: cargo build --release
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (signing off — compile + link check only)
        run: >-
          xcodebuild -project AlwaysConnect.xcodeproj
          -scheme AlwaysConnect -destination 'platform=macOS'
          build CODE_SIGNING_ALLOWED=NO
      - name: Run Helper engine smoke test (no server)
        # Exercises spawn + stdin feed + Transient classification +
        # backoff + max-attempts, with no gateway and no tun device.
        # No pf or routes are touched (no connect hook can fire).
        timeout-minutes: 5
        run: |
          brew install openconnect
          HELPER=$(find ~/Library/Developer/Xcode/DerivedData/AlwaysConnect-*/Build/Products/Debug -maxdepth 1 -name AlwaysConnectHelper -type f | head -1)
          test -n "$HELPER"
          rm -rf /tmp/ac-engine-test && mkdir -p /tmp/ac-engine-test
          # run-once exits 3 on attempts-exhausted BY DESIGN; the step
          # shell runs with set -e, so capture without aborting and
          # assert the exit code explicitly.
          set +e
          OUT=$(printf 'x\n' | "$HELPER" run-once --server https://127.0.0.1:9 --user nobody --max-attempts 2 --no-routes --cookie-store /tmp/ac-engine-test/session.json --support-dir /tmp/ac-engine-test 2>&1)
          RUN_EXIT=$?
          set -e
          echo "$OUT"
          test "$RUN_EXIT" -eq 3
          echo "$OUT" | grep -q "STATE authenticating"
          echo "$OUT" | grep -q "TERMINAL attempts-exhausted"
      - name: Run Helper engine test (mock gateway auth + cookie reuse)
        # Full loop short of a real tunnel: the mock AnyConnect server
        # replays ocserv's real auth-form XML, issues a fixed test
        # cookie, and answers CSTP CONNECT with 401. Password auth
        # must capture the cookie, the tun failure (the runner user
        # cannot create utun) classifies Transient, and later attempts
        # must reuse the cookie. No brew ocserv exists for macOS, so
        # the mock (stdlib Python only) is the gateway here.
        # --no-routes keeps the runner's routing untouched; pf loads
        # only on a connect hook, which cannot fire without a tun.
        # The mock and the test live in one step so no background
        # process has to survive across steps.
        timeout-minutes: 10
        run: |
          brew install openconnect
          mkdir -p /tmp/ac-mock
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ac-mock/ca-key.pem -out /tmp/ac-mock/ca-cert.pem -days 2 -nodes -subj "/CN=Mock Test CA" 2>/dev/null
          openssl req -newkey rsa:2048 -keyout /tmp/ac-mock/server-key.pem -out /tmp/ac-mock/server.csr -nodes -subj "/CN=localhost" 2>/dev/null
          printf "subjectAltName=IP:127.0.0.1,DNS:localhost" > /tmp/ac-mock/server.ext
          openssl x509 -req -in /tmp/ac-mock/server.csr -CA /tmp/ac-mock/ca-cert.pem -CAkey /tmp/ac-mock/ca-key.pem -CAcreateserial -out /tmp/ac-mock/server-cert.pem -days 2 -extfile /tmp/ac-mock/server.ext 2>/dev/null
          nohup python3 core/scripts/mock-anyconnect.py 4444 /tmp/ac-mock/server-cert.pem /tmp/ac-mock/server-key.pem /tmp/ac-mock/ca-cert.pem >/tmp/ac-mock/mock.log 2>&1 &
          echo $! > /tmp/ac-mock/mock.pid
          for _ in $(seq 1 20); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(0.5); sys.exit(0 if s.connect_ex(('127.0.0.1',4444))==0 else 1)" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          HELPER=$(find ~/Library/Developer/Xcode/DerivedData/AlwaysConnect-*/Build/Products/Debug -maxdepth 1 -name AlwaysConnectHelper -type f | head -1)
          test -n "$HELPER"
          rm -rf /tmp/ac-engine-test && mkdir -p /tmp/ac-engine-test
          # run-once runs in the background under a watchdog so that
          # even if it hangs, the mock log and partial output are
          # always printed (a plain command substitution would die
          # with the step timeout and hide the evidence).
          (printf 'testpass\n' | "$HELPER" run-once --server https://127.0.0.1:4444 --user testuser --cafile /tmp/ac-mock/ca-cert.pem --max-attempts 3 --no-routes --debug-child-output --cookie-store /tmp/ac-engine-test/session.json --support-dir /tmp/ac-engine-test > /tmp/ac-engine-test/out.txt 2>&1; echo $? > /tmp/ac-engine-test/exit.txt) &
          RUN_PID=$!
          for _ in $(seq 1 24); do
            kill -0 "$RUN_PID" 2>/dev/null || break
            sleep 5
          done
          kill "$RUN_PID" 2>/dev/null || true
          kill "$(cat /tmp/ac-mock/mock.pid)" || true
          echo "--- mock requests ---"
          cat /tmp/ac-mock/mock.log
          echo "--- run-once output ---"
          cat /tmp/ac-engine-test/out.txt
          RUN_EXIT=$(cat /tmp/ac-engine-test/exit.txt 2>/dev/null || echo "timeout")
          test "$RUN_EXIT" = "3"
          grep -q "credential password" /tmp/ac-engine-test/out.txt
          grep -q "credential cookie" /tmp/ac-engine-test/out.txt
          grep -q "TERMINAL attempts-exhausted" /tmp/ac-engine-test/out.txt
          grep -q mockcookie123 /tmp/ac-engine-test/session.json
      - name: Run Helper (pf anchor smoke check)
        # The scheme also builds AlwaysConnectHelper (a plain tool, no
        # entitlements needed to run). Verify generation output, and
        # that a missing gateway fails instead of silently passing.
        run: |
          HELPER=$(find ~/Library/Developer/Xcode/DerivedData/AlwaysConnect-*/Build/Products/Debug -maxdepth 1 -name AlwaysConnectHelper -type f | head -1)
          test -n "$HELPER"
          "$HELPER" generate-pf --phys en0 --tun utun5 --gateway 203.0.113.10 --allow 192.168.0.0/16 | grep -q "block drop out quick on en0 all"
          if "$HELPER" generate-pf --phys en0 --tun utun5 --allow 192.168.0.0/16 2>/dev/null; then
            echo "expected failure without --gateway" >&2
            exit 1
          fi
