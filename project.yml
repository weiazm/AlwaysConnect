# XcodeGen project definition for AlwaysConnect.
# Generate on macOS with: xcodegen generate
name: AlwaysConnect
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
targets:
  AlwaysConnect:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alwaysconnect.app
    info:
      path: Sources/App/Info.plist
    entitlements:
      path: Sources/App/AlwaysConnect.entitlements
    dependencies:
      - target: AlwaysConnectTunnel
      - target: AlwaysConnectProxy
  AlwaysConnectTunnel:
    type: app-extension
    platform: macOS
    sources:
      - Sources/Tunnel
      - Sources/Bridge
      - Sources/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alwaysconnect.app.tunnel
      # Links the Rust core staticlib (CI builds it first:
      # cargo build --release in core/). Required because RustCore.swift
      # calls the ac_engine_* C ABI symbols.
      OTHER_LDFLAGS: $(PROJECT_DIR)/core/target/release/libalwaysconnect_core.a
    info:
      path: Sources/Tunnel/Info.plist
    entitlements:
      path: Sources/Tunnel/AlwaysConnectTunnel.entitlements
  AlwaysConnectProxy:
    type: app-extension
    platform: macOS
    sources:
      - Sources/Proxy
      - Sources/Bridge
      - Sources/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alwaysconnect.app.proxy
      # Same staticlib link as the Tunnel: the proxy's direct-egress
      # decision calls the same ac_engine_* symbols.
      OTHER_LDFLAGS: $(PROJECT_DIR)/core/target/release/libalwaysconnect_core.a
    info:
      path: Sources/Proxy/Info.plist
    entitlements:
      path: Sources/Proxy/AlwaysConnectProxy.entitlements
  AlwaysConnectHelper:
    type: tool
    platform: macOS
    sources:
      - Sources/Helper
      - Sources/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alwaysconnect.app.helper
      # Same staticlib link: the Helper's generate-pf command calls
      # ac_pf_generate / ac_string_free.
      OTHER_LDFLAGS: $(PROJECT_DIR)/core/target/release/libalwaysconnect_core.a

schemes:
  AlwaysConnect:
    build:
      targets:
        AlwaysConnect: all
        AlwaysConnectHelper: all
